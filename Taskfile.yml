# https://taskfile.dev  -  `task --list`
version: "3"

vars:
  BRANCH: main
  REMOTE: origin

tasks:
  version:
    desc: Show the latest release tag and the next patch/minor/major
    silent: true
    cmds:
      - |
        cur=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
        IFS=. read -r M m p <<<"${cur#v}"
        echo "current: $cur"
        echo "patch:   v$M.$m.$((p+1))"
        echo "minor:   v$M.$((m+1)).0"
        echo "major:   v$((M+1)).0.0"

  release:patch:
    desc: Tag and push the next patch release (v1.2.3 -> v1.2.4)
    cmds:
      - task: _release
        vars: { BUMP: patch }

  release:minor:
    desc: Tag and push the next minor release (v1.2.3 -> v1.3.0)
    cmds:
      - task: _release
        vars: { BUMP: minor }

  release:major:
    desc: Tag and push the next major release (v1.2.3 -> v2.0.0)
    cmds:
      - task: _release
        vars: { BUMP: major }

  release:
    desc: "Tag and push an explicit version: task release -- 1.4.0"
    cmds:
      - task: _release
        vars: { EXPLICIT: "{{.CLI_ARGS}}" }

  # Add DRY=true to any release task to only print what would happen.
  _release:
    internal: true
    silent: true
    env:
      BUMP: "{{.BUMP}}"
      EXPLICIT: "{{.EXPLICIT}}"
      BRANCH: "{{.BRANCH}}"
      REMOTE: "{{.REMOTE}}"
    cmds:
      - |
        set -euo pipefail
        [ "$(git rev-parse --abbrev-ref HEAD)" = "$BRANCH" ] || { echo "must be on $BRANCH"; exit 1; }
        [ -z "$(git status --porcelain)" ] || { echo "working tree not clean"; exit 1; }
        git fetch "$REMOTE" "$BRANCH" --tags --quiet
        [ "$(git rev-parse HEAD)" = "$(git rev-parse "$REMOTE/$BRANCH")" ] || { echo "$BRANCH is not in sync with $REMOTE/$BRANCH"; exit 1; }

        cur=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
        if [ -n "$EXPLICIT" ]; then
          next="v${EXPLICIT#v}"
          [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $next"; exit 1; }
        else
          IFS=. read -r M m p <<<"${cur#v}"
          case "$BUMP" in
            major) next="v$((M+1)).0.0" ;;
            minor) next="v$M.$((m+1)).0" ;;
            patch) next="v$M.$m.$((p+1))" ;;
          esac
        fi
        git rev-parse -q --verify "refs/tags/$next" >/dev/null && { echo "tag $next already exists"; exit 1; }

        echo "$cur -> $next  ($(git rev-list --count "$cur"..HEAD 2>/dev/null || git rev-list --count HEAD) commits)"
        if [ "${DRY:-false}" = "true" ]; then echo "[dry run] would tag and push $next"; exit 0; fi
        git tag -a "$next" -m "Release $next"
        git push "$REMOTE" "$next"
        echo "pushed $next - CI will publish the image"
