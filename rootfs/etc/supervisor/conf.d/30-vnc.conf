; VNC servers only ever serve the Chrome window (see vnc.sh); noVNC wraps each in a websocket.
; Toggle with VNC_{RW,RO}_ENABLED / NOVNC_{RW,RO}_ENABLED (noVNC needs its matching VNC server).

[program:vnc-rw]
autostart=%(ENV_VNC_RW_ENABLED)s
command=/usr/local/bin/vnc.sh rw 5900
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc-ro]
autostart=%(ENV_VNC_RO_ENABLED)s
command=/usr/local/bin/vnc.sh ro 5901
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc-rw]
autostart=%(ENV_NOVNC_RW_ENABLED)s
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc-ro]
autostart=%(ENV_NOVNC_RO_ENABLED)s
command=/usr/bin/websockify --web /usr/share/novnc 6081 127.0.0.1:5901
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
