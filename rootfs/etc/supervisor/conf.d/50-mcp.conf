; chrome-devtools-mcp over HTTP, plus optional CDP port forwarder
[program:mcp]
command=/usr/local/bin/mcp.sh
user=chrome
priority=60
autorestart=true
autostart=%(ENV_MCP_ENABLED)s
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cdp-proxy]
command=/usr/local/bin/cdp-proxy.sh
user=chrome
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
