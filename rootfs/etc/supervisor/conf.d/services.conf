[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_RESOLUTION)sx%(ENV_DEPTH)s -nolisten tcp
user=chrome
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox --config-file /etc/openbox/rc.xml
user=chrome
environment=HOME="/home/chrome"
priority=20
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Watchdog: (re)launches Chrome whenever it exits or stops answering on CDP
[program:chrome-watchdog]
command=/usr/local/bin/chrome-watchdog.sh
user=chrome
environment=HOME="/home/chrome"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

; Both VNC servers only ever serve the Chrome window (see vnc.sh)
[program:vnc-rw]
command=/usr/local/bin/vnc.sh rw 5900
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc-ro]
command=/usr/local/bin/vnc.sh ro 5901
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc-rw]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
user=chrome
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc-ro]
command=/usr/bin/websockify --web /usr/share/novnc 6081 127.0.0.1:5901
user=chrome
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/usr/bin/python3 /usr/local/bin/api.py
user=chrome
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp]
command=/usr/local/bin/mcp.sh
user=chrome
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autostart=%(ENV_MCP_ENABLED)s
stopasgroup=true
killasgroup=true

[program:cdp-proxy]
command=/usr/local/bin/cdp-proxy.sh
user=chrome
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
