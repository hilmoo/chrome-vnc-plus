; Chrome. supervisord restarts it whenever it exits, so it can never stay closed.
[program:chrome]
command=/usr/local/bin/chrome.sh
user=chrome
environment=HOME="/home/chrome"
priority=30
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
startretries=999999
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
