name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chrome-vnc-plus:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke --shm-size=1g -e VNC_PASSWORD=ci -e START_URL=about:blank \
            -p 8080:8080 -p 8931:8931 -p 6080:6080 -p 6081:6081 chrome-vnc-plus:test
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break; sleep 2
          done
          sleep 10
          curl -fsS -o shot.png -w 'screenshot: %{http_code} %{size_download}B\n' localhost:8080/screenshot
          test "$(stat -c%s shot.png)" -gt 1000
          curl -fsS -o /dev/null localhost:6080/vnc.html
          curl -fsS -o /dev/null localhost:6081/vnc.html
          curl -fsS -X POST localhost:8931/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q chrome_devtools
          # watchdog: killing chrome must bring it back
          docker exec smoke pkill -9 -f remote-debugging-port
          for i in $(seq 1 30); do
            docker exec smoke curl -fs localhost:9222/json/version >/dev/null && ok=1 && break; sleep 2
          done
          test "$ok" = 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs smoke || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot
          path: shot.png
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag vX.Y.Z -> X.Y.Z, X.Y, X, latest | main -> edge | PR -> nothing is pushed
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
